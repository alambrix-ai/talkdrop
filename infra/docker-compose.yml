services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talkdrop
      POSTGRES_PASSWORD: talkdrop
      POSTGRES_DB: talkdrop
    ports:
      - '5432:5432'
    volumes:
      - talkdrop_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talkdrop -d talkdrop']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - talkdrop_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio123;
      mc mb -p local/talkdrop-evidence || true;
      mc anonymous set none local/talkdrop-evidence;
      exit 0;
      "

  # Real SFU for local `pnpm dev` (LIVEKIT_MOCK=false by default in .env.example).
  # Keys must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET (devkey / secret).
  livekit:
    image: livekit/livekit-server:v1.8.0
    command: --config /etc/livekit.yaml --dev
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:7880']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '1025:1025'
      - '8025:8025'

  # coturn is optional for local WebRTC; LiveKit --dev embeds a simple TURN.
  # Uncomment when testing remote peers across NATs.
  # coturn:
  #   image: coturn/coturn:4.6.2
  #   network_mode: host

volumes:
  talkdrop_pg:
  talkdrop_minio:
